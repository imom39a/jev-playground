[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-playground-minesweeper"
version = "0.1.0"
description = "LLM-vs-JEV and large-board JEV Minesweeper playground"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
minesweeper = "minesweeper.server:main"

[tool.setuptools.packages.find]
include = ["minesweeper*"]

[tool.setuptools.package-data]
minesweeper = ["web/*.html"]
